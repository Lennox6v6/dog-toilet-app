<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>멍당 — 우리 강아지 명당 찾기</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --green-bg:#E7F1E3;     /* 파스텔 녹색 배경 */
    --green-bg2:#DCEBD6;
    --green:#4CA771;        /* 포인트 녹색 */
    --green-d:#3C8A5C;
    --orange:#FF6A2B;       /* 강조 주황 (버튼) */
    --orange-d:#EE560F;
    --card:#FFFFFF;
    --ink:#22312A;          /* 진한 텍스트 */
    --muted:#6E7C74;        /* 흐린 텍스트 */
    --cream:#FBF7EF;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    --shadow:0 6px 20px rgba(34,49,42,.08);
    --shadow-sm:0 3px 10px rgba(34,49,42,.07);
  }
  html,body{font-family:var(--sans);color:var(--ink);background:var(--green-bg);-webkit-font-smoothing:antialiased;}
  #app{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--green-bg);}

  /* 헤더 */
  .top{padding:22px 20px 8px;}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand .logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--green-d);}
  .headline{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.15;}
  .headline .accent{color:var(--orange);}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px;font-weight:500;}

  /* 상태 칩 */
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .pill{background:var(--card);border-radius:12px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:6px;color:var(--ink);}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .pill .dot.warn{background:#F0B429;} .pill .dot.bad{background:var(--orange);}

  .body{padding:8px 16px 32px;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--sans);font-size:17px;font-weight:700;padding:16px;border:none;border-radius:16px;background:var(--orange);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(255,106,43,.3);transition:transform .1s,box-shadow .1s;}
  .btn:active{transform:scale(.98);}
  .btn.sub{background:var(--card);color:var(--green-d);box-shadow:var(--shadow-sm);margin-top:10px;}

  .sec{font-size:18px;font-weight:800;margin:22px 4px 12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.3px;}
  .sec .tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--green-bg2);border-radius:20px;padding:4px 11px;}

  #map{height:42dvh;min-height:240px;width:100%;border-radius:20px;overflow:hidden;background:#d7e6d2;box-shadow:var(--shadow);}

  /* 명당 카드 */
  .spot{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s;}
  .spot:active{transform:scale(.99);}
  .spot .rank{width:34px;height:34px;flex-shrink:0;border-radius:12px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--green-d);}
  .spot.top1 .rank{background:var(--orange);color:#fff;}
  .spot .info{flex:1;min-width:0;}
  .spot .name{font-size:16px;font-weight:700;}
  .spot .why{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500;}
  .spot .dist{font-size:14px;font-weight:800;color:var(--green-d);white-space:nowrap;}

  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .card .row{display:flex;gap:14px;align-items:center;}
  .card .lbl{font-size:15px;font-weight:700;margin-bottom:4px;}
  .sub-txt{font-size:14px;color:var(--muted);line-height:1.5;font-weight:500;}
  .wx{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .wx span{background:var(--green-bg);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;}

  .compass{width:76px;height:76px;flex-shrink:0;border-radius:50%;position:relative;background:var(--green-bg);box-shadow:inset 0 2px 6px rgba(34,49,42,.1);}
  .compass .ring{position:absolute;inset:0;transition:transform .2s;}
  .compass .lbl2{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;}
  .compass .n{top:5px;color:var(--orange);} .compass .s{bottom:5px;color:var(--muted);}
  .compass .e{right:6px;top:50%;transform:translateY(-50%);color:var(--muted);} .compass .w{left:6px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .compass .axis{position:absolute;left:50%;top:10px;bottom:10px;width:3px;transform:translateX(-50%);background:linear-gradient(var(--orange) 0 50%,var(--ink) 50% 100%);border-radius:3px;}

  .err{background:var(--cream);border-radius:14px;padding:14px;font-size:14px;box-shadow:var(--shadow-sm);color:var(--ink);line-height:1.5;}
  .demo-banner{background:var(--green);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
  .demo-banner .lbl{font-size:14px;font-weight:800;margin-bottom:2px;}
  .demo-banner .sub-txt{color:rgba(255,255,255,.9);}
  .loading{text-align:center;padding:20px;font-size:15px;font-weight:600;color:var(--muted);}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:16px 8px;line-height:1.7;font-weight:500;}
  .leaflet-container{font-family:var(--sans);}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">
      <div class="logo">
        <!-- 강아지 로고 아이콘 -->
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <ellipse cx="16" cy="19" rx="10" ry="9" fill="#4CA771"/>
          <path d="M8 12 Q5 5 11 8 Q13 10 12 15 Z" fill="#4CA771"/>
          <path d="M24 12 Q27 5 21 8 Q19 10 20 15 Z" fill="#4CA771"/>
          <circle cx="12.5" cy="17" r="1.8" fill="#fff"/>
          <circle cx="19.5" cy="17" r="1.8" fill="#fff"/>
          <ellipse cx="16" cy="21" rx="2.2" ry="1.6" fill="#22312A"/>
        </svg>
        멍당
      </div>
    </div>
    <div class="headline">오늘의 <span class="accent">명당</span>은<br>어디일까요?</div>
    <div class="subtitle">조용하고 아늑한 우리 강아지 볼일 자리를 찾아요</div>
    <div class="pills" id="topPills" style="display:none;">
      <span class="pill" id="pKp"><span class="dot" id="dKp"></span>정렬</span>
      <span class="pill" id="pWx"><span class="dot" id="dWx"></span>날씨</span>
    </div>
  </div>

  <div class="body">
    <div id="permitArea">
      <button class="btn" id="locBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" fill="#fff"/><circle cx="12" cy="9" r="2.5" fill="#FF6A2B"/></svg>
        내 위치로 명당 찾기
      </button>
      <p class="sub-txt" style="text-align:center;margin-top:12px;">현재 위치 기준으로 주변 명당을 찾아드려요.</p>
    </div>
    <div id="mapWrap" style="display:none;">
      <div class="sec">주변 명당 <span class="tag">반경 800m</span></div>
      <div id="map"></div>
      <div style="height:14px"></div>
    </div>
    <div id="content" style="display:none;"></div>
  </div>
</div>

<script>
(function loadLeaflet(){
  const css=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'];
  const js=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'];
  css.forEach(u=>{const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l);});
  let i=0;(function next(){if(i>=js.length){init(false);return;}const s=document.createElement('script');s.src=js[i++];s.onload=()=>{typeof L!=='undefined'?init(true):next();};s.onerror=next;document.body.appendChild(s);})();
})();

function init(hasMap){
  if(window.__started)return; window.__started=true;
  let map,userMarker,spotMarkers=[],userPos=null;

  const dogIcon = hasMap ? L.divIcon({html:'<div style="font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))">🐶</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]}) : null;
  const spotIcon = hasMap ? L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#FF6A2B;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)"></div>',className:'',iconSize:[18,18],iconAnchor:[9,9]}) : null;

  if(hasMap){
    try{
      map=L.map('map',{zoomControl:true,attributionControl:true}).setView([37.5665,126.9780],14);
      const sources=['https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png','https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'];
      let si=0,errs=0,tl;
      function addTiles(){tl=L.tileLayer(sources[si],{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap, © CARTO',crossOrigin:true});tl.on('tileerror',()=>{if(++errs===8&&si<sources.length-1){si++;errs=0;map.removeLayer(tl);addTiles();}});tl.addTo(map);}
      addTiles();
      setTimeout(()=>{try{map.invalidateSize();}catch(e){}},300);
    }catch(e){map=null;}
  }

  document.getElementById('locBtn').addEventListener('click',start);

  function start(){
    const pa=document.getElementById('permitArea');
    pa.innerHTML='<div class="loading">위치를 찾는 중…</div>';
    if(!navigator.geolocation){useDefault('이 브라우저는 위치 기능을 지원하지 않아요.');return;}
    let done=false;const t=setTimeout(()=>{if(!done){done=true;useDefault('위치 응답이 늦어요.');}},8000);
    navigator.geolocation.getCurrentPosition(
      p=>{if(done)return;done=true;clearTimeout(t);onPos(p);},
      e=>{if(done)return;done=true;clearTimeout(t);useDefault('위치를 가져오지 못했어요. ('+e.message+')');},
      {enableHighAccuracy:true,timeout:8000,maximumAge:60000});
  }

  function useDefault(reason){
    const pa=document.getElementById('permitArea');pa.style.display='block';
    pa.innerHTML=`<div class="err">${reason}<br><span style="color:var(--muted)">미리보기에서는 위치가 막힐 수 있어요. 실제로 쓰려면 폰 브라우저에서 열어주세요.</span></div>
      <button class="btn" id="retryLoc" style="margin-top:12px;">다시 시도</button>
      <button class="btn sub" id="demoLoc">서울시청 기준으로 데모 보기</button>`;
    document.getElementById('retryLoc').addEventListener('click',start);
    document.getElementById('demoLoc').addEventListener('click',()=>onPos({coords:{latitude:37.5665,longitude:126.9780}}));
  }

  async function onPos(pos){
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(map){
      map.setView([userPos.lat,userPos.lng],16);
      if(userMarker)map.removeLayer(userMarker);
      userMarker=L.marker([userPos.lat,userPos.lng],{icon:dogIcon}).addTo(map).bindPopup('지금 여기').openPopup();
      setTimeout(()=>{try{map.invalidateSize();}catch(e){}},200);
    }
    const pa=document.getElementById('permitArea');if(pa){pa.style.display='none';pa.innerHTML='';}
    document.getElementById('mapWrap').style.display='block';
    const content=document.getElementById('content');content.style.display='block';
    content.innerHTML='<div class="loading">주변 명당을 찾는 중…</div>';
    const [kp,weather,spots]=await Promise.all([loadKp(),loadWeather(userPos),loadSpots(userPos)]);
    render(kp,weather,spots);
    startCompass();
  }

  const DEMO_SPOTS=[
    {name:'덕수궁 돌담길 화단',type:'garden',dist:120,roadDist:60,footDist:20},
    {name:'서울광장 잔디밭',type:'grass',dist:210,roadDist:40,footDist:15},
    {name:'청계천 산책로 풀숲',type:'scrub',dist:340,roadDist:250,footDist:10},
    {name:'북창동 소공원',type:'park',dist:430,roadDist:180,footDist:35},
    {name:'남산 초입 녹지',type:'meadow',dist:610,roadDist:320,footDist:25},
    {name:'정동 골목 정원',type:'garden',dist:720,roadDist:140,footDist:40}
  ];
  function demoSpots(p){
    return {ok:true,demo:true,list:DEMO_SPOTS.map((s,i)=>{const a=i/DEMO_SPOTS.length*2*Math.PI;return{...s,lat:p.lat+Math.cos(a)*s.dist/111000,lng:p.lng+Math.sin(a)*s.dist/88000};})};
  }

  async function loadKp(){
    try{const r=await fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');const d=await r.json();const last=d[d.length-1];return{kp:parseFloat(last[1]),ok:true};}
    catch(e){return{ok:true,demo:true,kp:2};}
  }
  async function loadWeather(p){
    try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lng}&current=temperature_2m,precipitation,wind_speed_10m`);const d=await r.json();return{ok:true,...d.current};}
    catch(e){return{ok:true,demo:true,temperature_2m:21,precipitation:0,wind_speed_10m:2.4};}
  }
  async function loadSpots(p){
    const q=`[out:json][timeout:25];(
      way["leisure"="park"](around:800,${p.lat},${p.lng});
      way["landuse"="grass"](around:800,${p.lat},${p.lng});
      way["leisure"="garden"](around:800,${p.lat},${p.lng});
      way["natural"="scrub"](around:800,${p.lat},${p.lng});
      way["landuse"="meadow"](around:800,${p.lat},${p.lng});
      way["highway"~"^(motorway|trunk|primary|secondary)$"](around:800,${p.lat},${p.lng});
      way["highway"~"^(pedestrian|footway|path|living_street)$"](around:800,${p.lat},${p.lng});
    );out center tags;`;
    const eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
    for(const ep of eps){
      try{
        const r=await fetch(ep,{method:'POST',body:q});if(!r.ok)continue;
        const d=await r.json();const els=d.elements||[];
        const bigRoads=[],footPaths=[];
        els.forEach(e=>{if(!e.center||!e.tags)return;const hw=e.tags.highway;if(hw==='motorway'||hw==='trunk'||hw==='primary'||hw==='secondary')bigRoads.push(e.center);else if(hw==='pedestrian'||hw==='footway'||hw==='path'||hw==='living_street')footPaths.push(e.center);});
        let list=els.filter(e=>e.center&&e.tags&&(e.tags.leisure||e.tags.landuse||e.tags.natural)).map(e=>{
          const dist=haversine(p.lat,p.lng,e.center.lat,e.center.lon);
          const type=e.tags.leisure||e.tags.landuse||e.tags.natural||'green';
          let roadDist=9999;bigRoads.forEach(r=>roadDist=Math.min(roadDist,haversine(e.center.lat,e.center.lon,r.lat,r.lon)));
          let footDist=9999;footPaths.forEach(f=>footDist=Math.min(footDist,haversine(e.center.lat,e.center.lon,f.lat,f.lon)));
          return{lat:e.center.lat,lng:e.center.lon,dist,type,name:e.tags.name||typeLabel(type),roadDist,footDist};
        });
        if(list.length){list.sort((a,b)=>a.dist-b.dist);return{ok:true,list:list.slice(0,12)};}
      }catch(e){}
    }
    return demoSpots(p);
  }
  function typeLabel(t){return{park:'공원',grass:'잔디밭',garden:'정원',scrub:'풀숲',meadow:'초지',green:'녹지'}[t]||'녹지';}
  function quietLabel(s){if(s.roadDist==null||s.roadDist>=9999)return null;if(s.roadDist>200)return'아주 조용';if(s.roadDist>80)return'보통';return'큰길 근처';}
  function spotScore(s){let sc=Math.max(0,100-s.dist/8);sc+=({park:30,garden:25,scrub:35,meadow:30,grass:20}[s.type]||15);if(s.roadDist!=null&&s.roadDist<9999)sc+=Math.min(40,s.roadDist/6);if(s.footDist!=null&&s.footDist<60)sc+=12;return Math.round(sc);}

  function render(kp,weather,spots){
    const content=document.getElementById('content');
    document.getElementById('topPills').style.display='flex';

    let kpMsg;
    if(kp.kp<3){document.getElementById('pKp').lastChild.textContent=' 정렬 적합';document.getElementById('dKp').className='dot';kpMsg='지자기가 안정적이에요. 연구가 말한 「남북 정렬」 조건에 맞아요.';}
    else if(kp.kp<5){document.getElementById('pKp').lastChild.textContent=' 정렬 보통';document.getElementById('dKp').className='dot warn';kpMsg='지자기가 다소 흔들려요. 정렬 경향이 약해질 수 있어요.';}
    else{document.getElementById('pKp').lastChild.textContent=' 정렬 불안정';document.getElementById('dKp').className='dot bad';kpMsg='지자기 폭풍 수준이에요. 방향 선호가 사라진다고 해요.';}

    let wxMsg='',wxDetail='';
    if(weather.ok){
      const rain=weather.precipitation||0,temp=weather.temperature_2m,wind=weather.wind_speed_10m||0;
      let wtxt,cls='dot';
      if(rain>0.5){wtxt='비';cls='dot bad';wxMsg='지금 비가 와요. 잠깐 기다려요.';}
      else if(temp>=30){wtxt='더움';cls='dot warn';wxMsg='더워요. 아스팔트 화상 주의, 그늘 위주로.';}
      else if(temp<=-5){wtxt='추움';cls='dot warn';wxMsg='많이 추워요. 짧게 다녀오세요.';}
      else{wtxt='산책 좋음';wxMsg='산책하기 좋은 날씨예요.';}
      document.getElementById('pWx').lastChild.textContent=' '+wtxt;
      document.getElementById('dWx').className=cls;
      wxDetail=`<div class="wx"><span>${temp}°C</span><span>강수 ${rain}mm</span><span>바람 ${wind}m/s</span></div>`;
    }

    let html='';
    const isDemo=kp.demo||weather.demo||spots.demo;
    if(isDemo)html+=`<div class="demo-banner"><div class="lbl">데모 모드</div><div class="sub-txt">예시 데이터로 보여주고 있어요. 실제 내 주변을 보려면 폰 브라우저에서 열어주세요.</div></div>`;

    html+=`<div class="sec">명당 순위</div>`;
    if(spots.ok&&spots.list.length){
      const scored=spots.list.map(s=>({...s,score:spotScore(s)})).sort((a,b)=>b.score-a.score);
      scored.forEach((s,i)=>{
        const q=s.score>=130?'조용하고 아늑한 명당':s.score>=95?'괜찮은 자리':'무난한 자리';
        const quiet=quietLabel(s);
        html+=`<div class="spot${i===0?' top1':''}" data-lat="${s.lat}" data-lng="${s.lng}">
          <div class="rank">${i+1}</div>
          <div class="info"><div class="name">${escapeHtml(s.name)}</div><div class="why">${typeLabel(s.type)} · ${q}${quiet?' · '+quiet:''}</div></div>
          <div class="dist">${Math.round(s.dist)}m</div></div>`;
      });
      if(map){spotMarkers.forEach(m=>map.removeLayer(m));spotMarkers=[];scored.forEach(s=>{const m=L.marker([s.lat,s.lng],{icon:spotIcon}).addTo(map).bindPopup(`${escapeHtml(s.name)} · ${Math.round(s.dist)}m`);spotMarkers.push(m);});}
    }else if(!spots.ok){
      html+=`<div class="err">주변 명당 데이터를 못 불러왔어요. 폰 브라우저에서 열면 정상 동작해요.</div>`;
    }else{
      html+=`<div class="card"><div class="sub-txt">반경 800m 안에서 공원·녹지를 못 찾았어요. 조금 걸어서 범위를 넓혀보세요.</div></div>`;
    }

    html+=`<div class="sec">지금 정렬 적합도</div>
      <div class="card"><div class="row">
        <div class="compass"><div class="ring" id="cring"><span class="lbl2 n">N</span><span class="lbl2 s">S</span><span class="lbl2 e">E</span><span class="lbl2 w">W</span><div class="axis"></div></div></div>
        <div style="flex:1;"><div class="sub-txt">${kpMsg}</div><div class="sub-txt" id="headMsg" style="margin-top:6px;">폰을 평평하게 들면 나침반이 실제 방향을 가리켜요.</div></div>
      </div></div>`;

    if(weather.ok)html+=`<div class="sec">산책 적합도</div><div class="card"><div class="sub-txt">${wxMsg}</div>${wxDetail}</div>`;

    html+=`<button class="btn sub" id="refreshBtn">새로고침</button>`;
    html+=`<div class="foot">배변 시 남북축 정렬은 자기장이 안정적일 때(Kp 낮음) 관찰된 경향이에요. 확립된 정설은 아니며 참고용입니다.<br>출처: Hart et al., Frontiers in Zoology, 2013 · 데이터: OpenStreetMap · Open-Meteo · NOAA SWPC</div>`;

    content.innerHTML=html;
    if(map)setTimeout(()=>{try{map.invalidateSize();}catch(e){}},100);

    content.querySelectorAll('.spot').forEach(el=>el.addEventListener('click',()=>{if(map){map.setView([+el.dataset.lat,+el.dataset.lng],18);window.scrollTo({top:0,behavior:'smooth'});}}));
    document.getElementById('refreshBtn').addEventListener('click',()=>onPos({coords:{latitude:userPos.lat,longitude:userPos.lng}}));
  }

  function startCompass(){
    function handle(e){
      let hd=null;
      if(e.webkitCompassHeading!=null)hd=e.webkitCompassHeading;
      else if(e.alpha!=null)hd=360-e.alpha;
      if(hd==null)return;
      const ring=document.getElementById('cring');if(ring)ring.style.transform=`rotate(${-hd}deg)`;
      const hm=document.getElementById('headMsg');if(hm)hm.textContent='방향 감지 중 — 빨간 남북 축에 강아지를 나란히 맞춰보세요.';
    }
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')window.addEventListener('deviceorientation',handle,true);}).catch(()=>{});
    }else{window.addEventListener('deviceorientationabsolute',handle,true);window.addEventListener('deviceorientation',handle,true);}
  }

  function haversine(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(c-a),dLng=r(d-b);const x=Math.sin(dLat/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
}
</script>
